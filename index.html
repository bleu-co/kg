<!DOCTYPE html>
<html lang="en-GB" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kg</title>
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kg">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE   quiet, private, a word list to come back to
   IDEA    a personal glossary, A to Z, patched like a Pd canvas
   PICTURE the words themselves in bold; the add field is a Pd object box with inlet and outlet
   COLOUR  two greys only, swapped by a Pd toggle
   TYPE    Inter for words and definitions, SF Mono for word types, labels and controls */
:root{--bg:#141414;--ink:#ebebeb;--soft:rgba(235,235,235,.72);--faint:rgba(235,235,235,.36);--hair:rgba(235,235,235,.14);--mark:rgba(235,235,235,.08);color-scheme:dark}
:root[data-mode=light]{--bg:#ebebeb;--ink:#141414;--soft:rgba(20,20,20,.72);--faint:rgba(20,20,20,.4);--hair:rgba(20,20,20,.15);--mark:rgba(20,20,20,.06);color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.7 Inter,-apple-system,'Helvetica Neue',sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,'DejaVu Sans Mono',monospace;font-size:11px;line-height:1.2;letter-spacing:.03em}
main{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 76px) max(24px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 96px) max(24px,env(safe-area-inset-left))}
.bar{position:fixed;top:0;right:0;z-index:2;display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 12px) max(12px,env(safe-area-inset-right)) 0 0}
#status{color:var(--faint)}
.tgl{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.tgl span{width:17px;height:17px;border:1px solid currentColor;position:relative;overflow:hidden}
.tgl[aria-pressed=true] span::before,.tgl[aria-pressed=true] span::after{content:"";position:absolute;left:50%;top:50%;width:24px;height:1px;background:currentColor;transform:translate(-50%,-50%) rotate(45deg)}
.tgl[aria-pressed=true] span::after{transform:translate(-50%,-50%) rotate(-45deg)}
.tgl:focus-visible,.link:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.entry{margin:0 0 24px}
.row{display:flex;justify-content:space-between;align-items:center;min-height:16px;margin:0 0 7px}
.label{color:var(--faint);transition:color .2s}
.entry:focus-within .label{color:var(--ink)}
input,textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;color:inherit;font:inherit;padding:0;margin:0;caret-color:var(--ink);border-radius:0;-webkit-appearance:none;appearance:none}
textarea{overflow:hidden;field-sizing:content;min-height:1.6em;white-space:pre-wrap;overflow-wrap:break-word}
textarea::placeholder,input::placeholder{color:var(--faint);font-style:italic}
.box{position:relative;border:1px solid var(--hair);padding:14px 16px 16px;transition:border-color .2s}
.box:focus-within{border-color:var(--faint)}
.box::before,.box::after{content:"";position:absolute;left:-1px;width:12px;height:3px;background:var(--faint)}
.box::before{top:-1px}.box::after{bottom:-1px}
#add{font-weight:600}
#list{margin-top:40px}
.w{border-top:1px solid var(--hair);padding:16px 0 18px;transition:background-color .6s}
.w.flash{background:var(--mark)}
.head{display:flex;align-items:baseline;gap:16px}
.word{flex:1 1 auto;font-weight:600}
.type{flex:0 0 11ch;width:11ch;text-align:right;color:var(--faint)}
.type:focus{color:var(--ink)}
.def{font-size:14px;line-height:1.55;color:var(--soft);margin-top:3px;min-height:1.55em}
.def::placeholder{font-size:14px}
.empty{color:var(--faint);border-top:1px solid var(--hair);padding:20px 0;margin:0}
.link{background:none;border:0;padding:6px 0;margin:0;color:var(--faint);cursor:pointer;min-height:28px}
.link:hover,.link[aria-expanded=true]{color:var(--ink)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 22px;border-top:1px solid var(--hair);padding-top:18px;color:var(--faint)}
.foot .right{display:flex;gap:22px;margin-left:auto}
.panel{border-top:1px solid var(--hair);padding:30px 0 34px}
.panel .entry:last-child{margin-bottom:0}
.field{display:block;margin:0 0 14px}
.field .mono{display:block;color:var(--faint);margin:0 0 4px}
.field input{border-bottom:1px solid var(--hair);padding:2px 0 4px}
.field input:focus{border-bottom-color:var(--faint)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:0 22px}
.note{color:var(--faint);margin:2px 0 0;line-height:1.6}
@media(max-width:600px){main{padding-top:calc(env(safe-area-inset-top) + 64px)}.hint{display:none}}
@media(prefers-reduced-motion:reduce){body,.label,.box,.w{transition:none}}
</style>
</head>
<body>
<div class="bar">
  <span id="status" class="mono" aria-live="polite"></span>
  <button id="tgl" class="tgl" aria-label="Dark mode" aria-pressed="true" title="Toggle light and dark"><span></span></button>
</div>
<main>
  <div class="entry">
    <div class="row"><span class="label mono">add a word</span><span id="count" class="label mono"></span></div>
    <div class="box"><input id="add" aria-label="Add a word" enterkeyhint="done" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="true"></div>
  </div>
  <div id="list"></div>
  <section id="panel" class="panel" hidden aria-label="Sync">
    <div class="entry">
      <div class="row"><span class="label mono">sync</span><span id="syncState" class="label mono"></span></div>
      <div class="box">
        <div id="setup">
          <label class="field"><span class="mono">private repository</span><input id="repo" placeholder="username/kg-data" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
          <label class="field"><span class="mono">access token</span><input id="token" type="password" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
        </div>
        <div class="acts">
          <button id="connectBtn" class="link mono">connect</button>
          <button id="syncBtn" class="link mono" hidden>sync now</button>
          <button id="disconnectBtn" class="link mono" hidden>disconnect this device</button>
        </div>
        <p id="syncMsg" class="note mono"></p>
      </div>
    </div>
    <div class="entry">
      <div class="row"><span class="label mono">import</span></div>
      <div class="box">
        <textarea id="importText" rows="3" placeholder="Paste text from “copy all as text”, or a list of words, one per line" aria-label="Text to import" spellcheck="false"></textarea>
        <div class="acts"><button id="importBtn" class="link mono">import</button></div>
      </div>
    </div>
  </section>
  <div class="foot mono">
    <span class="hint">enter adds a word · empty a word to delete it</span>
    <span class="right">
      <button id="syncLink" class="link mono" aria-expanded="false" aria-controls="panel">sync</button>
      <button id="copyBtn" class="link mono">copy all as text</button>
    </span>
  </div>
</main>
<script>
{
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmtStamp=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())+' '+pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+String(d.getFullYear()).slice(2)};
/* Kj, Kn, Kt and Kg share one github.io address, so they share localStorage: every key here starts with "g." */
const LS={get(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

const statusEl=$('#status'),tgl=$('#tgl'),addIn=$('#add'),list=$('#list'),countEl=$('#count');
const setStatus=t=>{statusEl.textContent=t};
const fits=window.CSS&&CSS.supports&&CSS.supports('field-sizing','content');
const autosize=t=>{if(fits||t.tagName!=='TEXTAREA')return;t.style.height='auto';t.style.height=t.scrollHeight+'px'};
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)};
const key=w=>w.trim().toLowerCase().normalize('NFC');
const tidyWord=w=>w.replace(/\s+/g,' ').trim();

/* ---------- local state ----------
   word: {w: word, t: word type, d: definition, u: last change, p: definition still to fetch} */
const clean=(id,v)=>{
  if(!v||typeof v.w!=='string')return null;
  return {id,w:v.w,t:String(v.t==null?'':v.t),d:String(v.d==null?'':v.d),u:typeof v.u==='number'?v.u:0,p:v.p===true};
};
const pack=e=>{const o={w:e.w,t:e.t,d:e.d,u:e.u};if(e.p)o.p=true;return o};
let words=new Map();
for(const [k,v] of Object.entries(LS.get('g.words',{}))){const e=clean(k,v);if(e)words.set(k,e)}
let dead=LS.get('g.dead',{})||{};
let mode=LS.get('g.mode','dark'),modeU=LS.get('g.modeU',0);
let cfg=LS.get('g.sync',null);
let dirty=LS.get('g.dirty',false);
let structKey=null;
const nodes=new Map();
let cacheT=null;
const cacheNow=()=>{clearTimeout(cacheT);cacheT=null;
  LS.set('g.words',Object.fromEntries([...words].map(([k,e])=>[k,pack(e)])));
  LS.set('g.dead',dead);LS.set('g.mode',mode);LS.set('g.modeU',modeU);LS.set('g.dirty',dirty)};
const cacheSoon=()=>{if(!cacheT)cacheT=setTimeout(cacheNow,400)};
const changed=()=>{dirty=true;cacheSoon();schedulePush()};

const meta=document.querySelector('meta[name=theme-color]');
const applyMode=()=>{document.documentElement.dataset.mode=mode;tgl.setAttribute('aria-pressed',String(mode==='dark'));meta.content=mode==='dark'?'#141414':'#ebebeb'};
tgl.addEventListener('click',()=>{mode=mode==='dark'?'light':'dark';modeU=Date.now();applyMode();changed()});

const find=w=>{const k=key(w);for(const e of words.values())if(key(e.w)===k)return e;return null};
function remove(id){words.delete(id);nodes.delete(id);dead[id]=Date.now();render();changed()}

/* ---------- definitions: Free Dictionary API, then Wiktionary ---------- */
const SKIP=/^(alternative|obsolete|archaic|plural of|present participle|past participle|simple past|third-person|misspelling|abbreviation of|initialism of|synonym of|form of|eye dialect|nonstandard)/i;
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent||''};
/* a few words: first clause, no brackets, no trailing full stop */
const words_=s=>s.split(' ').length;
function shorten(s){
  s=s.replace(/\([^)]*\)/g,'').replace(/\[[^\]]*\]/g,'').replace(/\s+/g,' ').trim();
  s=s.split(/;|:\s/)[0].replace(/\s+([,.])/g,'$1').trim();
  return s.replace(/[.,]+$/,'').trim();
}
function cut(s){ /* longer than a few words: stop at a comma, otherwise after eight words */
  const parts=s.split(' ');
  if(parts.length<=10)return s;
  let at=0,n=0;for(const w of parts){n++;if(n>=3&&n<=10&&/,$/.test(w))at=n}
  return at?parts.slice(0,at).join(' ').replace(/,$/,''):parts.slice(0,8).join(' ')+'…';
}
const low=s=>s?s[0].toLowerCase()+s.slice(1):'';
function pick(senses){ /* senses: [{t, defs:[...]}] in dictionary order; prefer a short definition of the first kind of word */
  const all=[];
  senses.forEach((s,si)=>s.defs.forEach(d=>{const txt=shorten(d||'');if(txt)all.push({t:s.t.toLowerCase(),d:txt,si,skip:SKIP.test(txt)})}));
  const good=all.filter(x=>!x.skip),pool=good.length?good:all;
  if(!pool.length)return null;
  const first=pool[0],firstKind=pool.filter(x=>x.t===first.t).slice(0,4);
  const short=firstKind.find(x=>words_(x.d)<=10)||pool.slice(0,6).find(x=>words_(x.d)<=10);
  const x=short||first;
  return {t:x.t,d:low(cut(x.d))};
}
async function viaFreeDictionary(w){
  const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w.toLowerCase()));
  if(r.status===404)return null;
  if(!r.ok)throw new Error('dictionary '+r.status);
  const j=await r.json();const senses=[];
  for(const en of (Array.isArray(j)?j:[]))for(const m of (en.meanings||[]))senses.push({t:m.partOfSpeech||'',defs:(m.definitions||[]).map(x=>x.definition||'')});
  return pick(senses);
}
async function viaWiktionary(w){
  const tryOne=async q=>{
    const r=await fetch('https://en.wiktionary.org/api/rest_v1/page/definition/'+encodeURIComponent(q.replace(/ /g,'_')));
    if(r.status===404)return null;
    if(!r.ok)throw new Error('wiktionary '+r.status);
    const j=await r.json();
    const senses=(j.en||[]).map(s=>({t:s.partOfSpeech||'',defs:(s.definitions||[]).map(x=>strip(x.definition||''))}));
    return pick(senses);
  };
  return (await tryOne(w))||(w!==w.toLowerCase()?await tryOne(w.toLowerCase()):null);
}
async function lookUp(w){
  let offline=false;
  for(const f of [viaFreeDictionary,viaWiktionary]){
    try{const r=await f(w);if(r)return r}catch(e){offline=true}
  }
  if(offline&&!navigator.onLine)throw new Error('offline');
  return offline?Promise.reject(new Error('unreachable')):null;
}
let fetching=false;
async function fetchPending(){
  if(fetching)return;fetching=true;
  try{
    for(;;){
      const e=[...words.values()].find(x=>x.p&&!x.busy);
      if(!e)break;
      e.busy=true;const asked=e.w;
      let res;
      try{res=await lookUp(asked)}catch(err){e.busy=false;setStatus('definitions wait for a connection');break}
      e.busy=false;
      const cur=words.get(e.id);if(!cur||!cur.p)continue;
      if(key(cur.w)!==key(asked))continue; /* the word changed meanwhile; fetch again */
      cur.p=false;
      if(res){if(!cur.d.trim())cur.d=res.d;if(!cur.t.trim())cur.t=res.t}
      cur.u=Date.now();
      const n=nodes.get(cur.id);if(n)fill(n,cur,true);
      if(!res)cur.nf=true;if(n)fill(n,cur,true);
      changed();
    }
  }finally{fetching=false}
}

/* ---------- adding ---------- */
function flash(id){
  const n=nodes.get(id);if(!n)return;
  n.el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});
  n.el.classList.add('flash');setTimeout(()=>n.el.classList.remove('flash'),1400);
}
function addWord(raw){
  const w=tidyWord(raw);if(!w)return null;
  const have=find(w);
  if(have){setStatus('already here');return have.id}
  let id='g'+hash(key(w));
  while(words.has(id))id+='x';
  delete dead[id];
  words.set(id,{id,w,t:'',d:'',u:Date.now(),p:true});
  return id;
}
addIn.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter'||ev.isComposing)return;
  ev.preventDefault();
  const id=addWord(addIn.value);if(!id)return;
  addIn.value='';render();changed();flash(id);fetchPending();
});

/* ---------- rendering ---------- */
function fill(n,e,force){
  if(force||document.activeElement!==n.word){if(n.word.value!==e.w)n.word.value=e.w}
  if(force||document.activeElement!==n.type){if(n.type.value!==e.t)n.type.value=e.t}
  if(force||document.activeElement!==n.def){if(n.def.value!==e.d)n.def.value=e.d}
  n.def.placeholder=e.p?'looking up…':e.nf?'no definition found, type one':'definition';
  n.type.placeholder=e.p?'':'type';
  autosize(n.def);
}
function nodeFor(e){
  let n=nodes.get(e.id);
  if(!n){
    const el=document.createElement('div');el.className='w';
    const head=document.createElement('div');head.className='head';
    const word=document.createElement('input');word.className='word';word.setAttribute('aria-label','Word');word.autocapitalize='off';word.autocomplete='off';word.spellcheck=true;
    const type=document.createElement('input');type.className='type mono';type.setAttribute('aria-label','Word type');type.autocapitalize='off';type.autocomplete='off';type.spellcheck=false;
    head.append(word,type);
    const def=document.createElement('textarea');def.className='def';def.rows=1;def.setAttribute('aria-label','Definition');
    el.append(head,def);
    const id=e.id;word.dataset.id=type.dataset.id=def.dataset.id=id;
    const edit=(f,v)=>{const cur=words.get(id);if(!cur)return;cur[f]=v;cur.u=Date.now();changed()};
    word.addEventListener('input',()=>edit('w',tidyWord(word.value)?word.value:''));
    word.addEventListener('blur',()=>{
      const cur=words.get(id);if(!cur)return;
      const w=tidyWord(word.value);
      if(!w){remove(id);return}
      const other=find(w);
      if(other&&other.id!==id){setStatus('already here');word.value=cur.w=w;}
      if(w!==cur.w||word.value!==w){cur.w=w;word.value=w;cur.u=Date.now();changed()}
      if(!cur.d.trim()&&!cur.p){cur.p=true;fill(n,cur);fetchPending()}
      cacheNow();setTimeout(()=>{render();if(!document.activeElement||document.activeElement===document.body)flash(id)});
    });
    type.addEventListener('input',()=>edit('t',type.value));
    def.addEventListener('input',()=>{edit('d',def.value);autosize(def)});
    for(const f of [word,type])f.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.isComposing){ev.preventDefault();def.focus()}});
    def.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();def.blur()}});
    [type,def].forEach(f=>f.addEventListener('blur',()=>{const cur=words.get(id);if(cur){cur.t=cur.t.trim();cur.d=cur.d.trim();cacheNow()}}));
    n={el,word,type,def};nodes.set(id,n);
  }
  fill(n,e);
  return n.el;
}
const coll=new Intl.Collator('en-GB',{sensitivity:'base',numeric:true});
const order=(a,b)=>coll.compare(a.w,b.w)||a.w.localeCompare(b.w);
function render(){
  const act=document.activeElement,actId=act&&act.dataset?act.dataset.id:null;
  const shown=[...words.values()].filter(e=>e.id===actId||e.w.trim()).sort(order);
  /* while a word is being edited the list keeps its old order; it re-sorts on leaving the field */
  if(actId&&act.classList.contains('word')){
    const prev=[...list.children].map(el=>[...nodes].find(([,n])=>n.el===el)).filter(Boolean).map(([k])=>k);
    const pos=new Map(prev.map((k,i)=>[k,i]));
    if(shown.every(e=>pos.has(e.id)))shown.sort((a,b)=>pos.get(a.id)-pos.get(b.id));
  }
  const n=shown.length;countEl.textContent=n?(n===1?'1 word':n+' words'):'';
  const k=shown.map(e=>e.id).join(',');
  if(k===structKey){shown.forEach(nodeFor);return}
  structKey=k;
  const s=actId&&'selectionStart' in act?act.selectionStart:0,en=actId&&'selectionEnd' in act?act.selectionEnd:0;
  const els=shown.map(nodeFor);
  if(!n){const p=document.createElement('p');p.className='empty mono';p.textContent='no words yet';els.push(p)}
  list.replaceChildren(...els);
  for(const id of [...nodes.keys()])if(!words.has(id))nodes.delete(id);
  if(actId&&act.isConnected&&document.activeElement!==act){act.focus({preventScroll:true});try{act.setSelectionRange(s,en)}catch(e){}}
  requestAnimationFrame(sizeAll);
}
const sizeAll=()=>{if(!fits)document.querySelectorAll('#list textarea,#importText').forEach(autosize)};

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){cacheNow();if(dirty)sync()}
  else{sync();fetchPending()}
});
window.addEventListener('pagehide',cacheNow);
window.addEventListener('online',()=>{sync();fetchPending()});
setInterval(()=>{if(!document.hidden)sync()},60000);
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(sizeAll,150)});

/* copy format:  serendipity · noun
                 finding good things by chance */
function plainText(){
  return [...words.values()].filter(e=>e.w.trim()).sort(order)
    .map(e=>e.w+(e.t.trim()?' · '+e.t.trim():'')+(e.d.trim()?'\n'+e.d.trim():'')).join('\n\n');
}
$('#copyBtn').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(plainText());setStatus('copied')}catch(e){setStatus('copy refused')}
});

/* ---------- sync: one JSON file in a private GitHub repository ---------- */
const API='https://api.github.com',FILE='glossary.json';
let busy=false,again=false,pushT=null;
function schedulePush(){if(!cfg)return;clearTimeout(pushT);pushT=setTimeout(()=>sync(),3000)}

const snapshot=()=>({v:1,mode,modeU,words:Object.fromEntries([...words].filter(([,e])=>e.w.trim()).map(([k,e])=>[k,pack(e)])),deleted:{...dead}});
function normal(d){
  const out={v:1,mode:'dark',modeU:0,words:{},deleted:{}};
  if(!d||typeof d!=='object')return out;
  if(d.mode==='dark'||d.mode==='light'){out.mode=d.mode;out.modeU=+d.modeU||0}
  for(const [k,v] of Object.entries(d.words||{})){const e=clean(k,v);if(e)out.words[k]=pack(e)}
  for(const [k,t] of Object.entries(d.deleted||{}))if(typeof t==='number')out.deleted[k]=t;
  return out;
}
function merge(a,b){
  const E={},D={...a.deleted};
  for(const [k,t] of Object.entries(b.deleted))D[k]=Math.max(D[k]||0,t);
  for(const src of [a.words,b.words])for(const [k,e] of Object.entries(src))if(!E[k]||e.u>E[k].u)E[k]=e;
  for(const k of Object.keys(E))if(D[k]!=null){if(E[k].u<=D[k])delete E[k];else delete D[k]}
  /* the same word added on two devices under different ids: keep the one changed last */
  const seen=new Map();
  for(const k of Object.keys(E).sort()){
    const w=key(E[k].w),o=seen.get(w);
    if(o==null){seen.set(w,k);continue}
    const [keep,drop]=E[k].u>E[o].u?[k,o]:[o,k];
    if(!E[keep].d.trim()&&E[drop].d.trim()){E[keep].d=E[drop].d;E[keep].t=E[keep].t||E[drop].t;delete E[keep].p}
    delete E[drop];D[drop]=Math.max(D[drop]||0,E[keep].u);seen.set(w,keep);
  }
  const m=b.modeU>a.modeU?b:a;
  return {v:1,mode:m.mode,modeU:m.modeU,words:E,deleted:D};
}
const sorted=v=>Array.isArray(v)?v.map(sorted):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,sorted(v[k])])):v;
const serial=o=>JSON.stringify(sorted(o),null,1)+'\n';
function adopt(m){
  const cur=merge(snapshot(),m);
  const act=document.activeElement,actId=act&&act.dataset?act.dataset.id:null;
  const next=new Map();
  for(const [k,e] of Object.entries(cur.words))next.set(k,clean(k,e));
  /* a word being typed over keeps what is on screen */
  if(actId&&words.has(actId)&&!cur.deleted[actId]){const mine=words.get(actId);if(!next.has(actId)||!mine.w.trim())next.set(actId,mine)}
  words=next;dead=cur.deleted;
  if(cur.mode!==mode){mode=cur.mode;applyMode()}
  modeU=cur.modeU;
  render();fetchPending();
}
const enc=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)};
const dec=s=>{const r=atob(s.replace(/\s/g,''));const b=new Uint8Array(r.length);for(let i=0;i<r.length;i++)b[i]=r.charCodeAt(i);return new TextDecoder().decode(b)};
class SyncError extends Error{constructor(msg,fatal){super(msg);this.fatal=fatal}}
async function gh(c,method,path,body){
  let r;
  try{r=await fetch(API+'/repos/'+c.repo+path,{method,cache:'no-store',headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined})}
  catch(e){throw new SyncError('offline, saved here')}
  if(r.status===401)throw new SyncError('token refused',true);
  if(r.status===403&&r.headers.get('x-ratelimit-remaining')==='0')throw new SyncError('github busy, will retry');
  return r;
}
async function pull(c){
  const r=await gh(c,'GET','/contents/'+FILE);
  if(r.status===404)return {sha:null,data:null};
  if(!r.ok)throw new SyncError(r.status===403?'token cannot read this repository':'sync error '+r.status,r.status===403);
  const j=await r.json();
  let b64=j.content||'';
  if(!b64&&j.size>0){const b=await gh(c,'GET','/git/blobs/'+j.sha);if(!b.ok)throw new SyncError('sync error '+b.status);b64=(await b.json()).content||''}
  let data=null;try{data=b64?JSON.parse(dec(b64)):null}catch(e){throw new SyncError('glossary.json is not readable',true)}
  return {sha:j.sha,data};
}
async function sync(){
  if(!cfg)return;
  if(busy){again=true;return}
  busy=true;clearTimeout(pushT);
  const c=cfg;
  try{
    setStatus('syncing');
    for(let i=0;;i++){
      const {sha,data}=await pull(c);
      const remote=normal(data);
      dirty=false;
      const merged=merge(snapshot(),remote);
      adopt(merged);
      const out=serial(merged);
      if(data&&out===serial(remote))break;
      const r=await gh(c,'PUT','/contents/'+FILE,{message:'glossary '+fmtStamp(Date.now()),content:enc(out),...(sha?{sha}:{})});
      if(r.ok)break;
      if((r.status===409||r.status===422)&&i<4)continue;
      throw new SyncError(r.status===403||r.status===404?'token cannot write to this repository':'sync error '+r.status,r.status===403||r.status===404);
    }
    if(cfg===c){setStatus('synced');syncMsg('Last synced '+fmtStamp(Date.now())+'.')}
  }catch(e){
    dirty=true;
    setStatus(e.message||'offline, saved here');
    if(e.fatal)syncMsg('Sync paused: '+e.message+'. Check the repository name and token, then connect again.');
  }finally{
    busy=false;cacheNow();
    if(again){again=false;sync()}
  }
}

/* ---------- sync panel ---------- */
const panel=$('#panel'),syncLink=$('#syncLink'),repoIn=$('#repo'),tokenIn=$('#token');
const syncMsg=t=>{$('#syncMsg').textContent=t};
function panelUi(){
  $('#setup').hidden=!!cfg;
  $('#connectBtn').hidden=!!cfg;
  $('#syncBtn').hidden=$('#disconnectBtn').hidden=!cfg;
  $('#syncState').textContent=cfg?cfg.repo:'not connected';
  if(!cfg){syncMsg('Words are kept on this device only. Connect a private GitHub repository to sync between devices.');setStatus('this device only')}
}
syncLink.addEventListener('click',()=>{
  panel.hidden=!panel.hidden;syncLink.setAttribute('aria-expanded',String(!panel.hidden));
  if(!panel.hidden)panel.scrollIntoView({behavior:'smooth',block:'start'});
});
$('#connectBtn').addEventListener('click',async()=>{
  const repo=repoIn.value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  const token=tokenIn.value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){syncMsg('Write the repository as username/name.');return}
  if(!token){syncMsg('Paste the access token.');return}
  syncMsg('Checking…');
  const c={repo,token};
  try{
    const r=await gh(c,'GET','');
    if(r.status===404||r.status===403){syncMsg('That repository was not found, or the token cannot see it.');return}
    if(!r.ok){syncMsg('GitHub answered '+r.status+'. Try again.');return}
    const j=await r.json();
    if(!j.private){syncMsg('That repository is public. Make it private first, so nobody else can read your words.');return}
  }catch(e){syncMsg(e.fatal?'GitHub refused that token.':'Could not reach GitHub. Check the connection.');return}
  cfg=c;LS.set('g.sync',cfg);tokenIn.value='';dirty=true;panelUi();syncMsg('Connected. Syncing…');sync();
});
$('#syncBtn').addEventListener('click',()=>sync());
$('#disconnectBtn').addEventListener('click',()=>{
  cfg=null;LS.del('g.sync');panelUi();
  syncMsg('Disconnected. Words stay on this device and in the repository.');
});

/* import: blocks from "copy all as text", or a plain list of words one per line */
function parseText(t){
  const blocks=t.replace(/\r\n?/g,'\n').split(/\n\s*\n/).map(b=>b.split('\n').map(l=>l.trim()).filter(Boolean)).filter(b=>b.length);
  const out=[];
  for(const b of blocks){
    const listy=b.length>1&&b.every(l=>!l.includes(' · ')&&l.split(' ').length<=3);
    if(listy){b.forEach(l=>out.push({w:l,t:'',d:''}));continue}
    const [first,...rest]=b;const i=first.lastIndexOf(' · ');
    out.push(i>0?{w:first.slice(0,i),t:first.slice(i+3),d:rest.join(' ')}:{w:first,t:'',d:rest.join(' ')});
  }
  return out;
}
$('#importBtn').addEventListener('click',()=>{
  const ta=$('#importText'),items=parseText(ta.value);
  if(!items.length){setStatus('nothing to import');return}
  let added=0;
  for(const it of items){
    const before=words.size,id=addWord(it.w);
    if(!id||words.size===before)continue;
    const e=words.get(id);e.t=it.t.trim();e.d=it.d.trim();e.p=!e.d;added++;
  }
  ta.value='';autosize(ta);render();changed();fetchPending();
  setStatus(added?'imported '+added:'already here');
});

applyMode();render();panelUi();addIn.focus({preventScroll:true});
fetchPending();
if(cfg)sync();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
